<head><meta charset="utf-8"><title>Alert — preview</title></head>

<div id="root"></div>
<script>
var B = window.RA, h = React.createElement;

ReactDOM.createRoot(document.getElementById("root")).render(S(h("div", { style: { display: "flex", flexDirection: "column", gap: 12, width: "100%" } },
